name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published app bundle
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            html="$(curl --fail --silent --show-error --location "${PAGE_URL}?verify=${GITHUB_SHA}" 2>/dev/null || true)"
            if printf '%s' "$html" | grep -Eq 'src="[^"]*/assets/main-[^"]+\.js"'; then
              echo "GitHub Pages is serving the built app bundle."
              exit 0
            fi
            sleep 5
          done
          if printf '%s' "$html" | grep -Fq 'src="src/main.js"'; then
            echo "::error::GitHub Pages is serving raw source files. In repository Settings > Pages, set Build and deployment > Source to GitHub Actions, then rerun this workflow."
          else
            echo "::error::Could not verify the built app bundle at ${PAGE_URL}. Check the GitHub Pages deployment."
          fi
          exit 1
